# Cloud Run サービス定義 (PRD 13-1)。
#
#   Cloud Load Balancer → WAF → API Gateway → Cloud Run → Application → Firestore
#
# 適用:
#   gcloud run services replace deploy/cloud-run.yaml --region asia-northeast1
#
# PROJECT_ID / REGION / IMAGE_TAG / SERVICE_ACCOUNT_EMAIL は適用前に置換すること。
# 置換を忘れた状態で apply しても失敗するよう、あえてダミー値を入れていない。

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: reception-saas
  labels:
    app: reception-saas
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        # 受付は営業時間中ずっと使われる。コールドスタートで
        # 「受付できない数秒」を作らないよう最小インスタンスを常駐させる
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: SERVICE_ACCOUNT_EMAIL
      # 1インスタンスあたりの同時リクエスト数
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/reception/reception-saas:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            # 本番にデモデータを入れない
            - name: RECEPTION_SEED
              value: "0"
            # 署名鍵・APIシークレットは Secret Manager から (PRD 13-4)
            - name: RECEPTION_DEVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: reception-device-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
            timeoutSeconds: 3
  traffic:
    # ロールバック可能にするため、リビジョンにタグを付けて段階的に流す (PRD 4-5)
    - percent: 100
      latestRevision: true
