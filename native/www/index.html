<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>受付</title>
    <style>
      /*
        アプリに同梱される唯一の画面。サーバーへ到達できないときだけ出る。
        店舗の回線が落ちた瞬間に来店客が見るので、
        「壊れた」ではなく「スタッフを呼べばよい」と伝わることを優先する。
      */
      :root { color-scheme: light; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #f8fafc; color: #0f172a;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none; -webkit-touch-callout: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      main { text-align: center; padding: 2rem; max-width: 34rem; }
      h1 { font-size: 1.75rem; margin: 0 0 0.75rem; }
      p { font-size: 1rem; line-height: 1.8; color: #475569; margin: 0 0 2rem; }
      button {
        font: inherit; font-weight: 600; color: #fff; background: #0f172a;
        border: 0; border-radius: 0.75rem; padding: 1rem 2.5rem;
        min-height: 3.5rem; min-width: 12rem;
      }
      button:active { background: #1e293b; }
      .hint { margin-top: 1.5rem; font-size: 0.8rem; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main>
      <h1>ただいま接続できません</h1>
      <p>
        通信の状態を確認しています。<br />
        お急ぎの場合はスタッフにお声がけください。
      </p>
      <button type="button" id="retry">再読み込み</button>
      <p class="hint" id="status"></p>
    </main>
    <script>
      // 自動で復帰させる。スタッフが端末を触りに行かなくても、
      // 回線が戻れば受付画面へ自力で戻るのが望ましい。
      var status = document.getElementById('status');
      var attempts = 0;

      function reload() {
        window.location.reload();
      }

      document.getElementById('retry').addEventListener('click', reload);
      window.addEventListener('online', reload);

      setInterval(function () {
        attempts += 1;
        status.textContent = '自動で再接続を試みています（' + attempts + '回目）';
        if (navigator.onLine) reload();
      }, 15000);
    </script>
  </body>
</html>
